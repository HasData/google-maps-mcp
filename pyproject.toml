[project]
name = "hasdata-google-maps-mcp"
version = "1.0.1"
description = "MCP server for Google Maps through HasData's hosted API. No Google Cloud project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "google-maps", "maps", "places", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/google-maps-search-api"
Repository = "https://github.com/HasData/google-maps-mcp"

[project.scripts]
hasdata-google-maps-mcp = "hasdata_google_maps_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_google_maps_mcp"]
